apiVersion: v1
kind: Pod
metadata:
  name: resources
  labels:
    project: roboshop
spec:
  containers:
  - name: resources
    image: nginx
    resources:           
      requests:
        memory: "128Mi"       #soft limit
        cpu: "100m"         # 1000m = 1 CPU
      limits:
        memory: "256Mi"          # hard limit
        cpu: "150m"             